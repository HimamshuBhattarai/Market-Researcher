[project]
name = "ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Himamshu", email = "146966434+HimamshuBhattarai@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "langgraph>=1.2.24",
    "openai>=3.57.0",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "streamlit>=1.67.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
ai = "ai:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
